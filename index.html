<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"> <!-- Кодировка для поддержки кириллицы -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Чтобы сайт был адаптивным на телефонах -->
    <title>Секреты московского камня</title>
    <!-- Подключаем Tailwind CSS через CDN (интернет-ссылку) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Добавляем немного кастомного стиля для плавности */
        .modal-transition { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans">

    <!-- Шапка сайта -->
    <header class="py-10 text-center">
        <h1 class="text-4xl font-serif font-bold text-stone-700">Секреты московского камня</h1>
        <p class="text-stone-500 mt-2">Разгадай деталь — узнай историю</p>
    </header>

    <!-- Сетка с памятниками. Сюда JavaScript будет вставлять карточки -->
    <main id="monuments-grid" class="container mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 pb-20">
        <!-- Карточки появятся здесь автоматически -->
    </main>

    <!-- Модальное окно (по умолчанию скрыто классом hidden) -->
    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <!-- Контейнер окна -->
        <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl relative modal-transition">
            
            <!-- Кнопка закрытия -->
            <button onclick="closeModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-600 text-2xl">&times;</button>

            <!-- ЭКРАН 1: ЗАГАДКА -->
            <div id="riddle-screen" class="p-6 text-center">
                <img id="modal-macro-img" src="" class="w-full h-64 object-cover rounded-lg mb-6 shadow-md">
                <p id="modal-hint" class="text-lg italic text-stone-600 mb-6"></p>
                <button onclick="revealProfile()" class="bg-stone-800 text-white px-8 py-3 rounded-full hover:bg-stone-700 transition shadow-lg">Кто я?</button>
            </div>

            <!-- ЭКРАН 2: ПРОФИЛЬ (скрыт по умолчанию) -->
            <div id="profile-screen" class="hidden p-6">
                <img id="modal-full-img" src="" class="w-full h-64 object-cover rounded-lg mb-6 shadow-md">
                <h2 id="modal-name" class="text-3xl font-serif font-bold mb-4 text-stone-800"></h2>
                <p id="modal-bio" class="text-stone-600 leading-relaxed mb-6"></p>
                <a id="modal-link" href="" target="_blank" class="inline-block border-2 border-stone-800 text-stone-800 px-6 py-2 rounded-lg hover:bg-stone-800 hover:text-white transition font-medium">Найти на карте</a>
            </div>

        </div>
    </div>

    <!-- Подключаем наши скрипты. Сначала данные, потом логика -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
